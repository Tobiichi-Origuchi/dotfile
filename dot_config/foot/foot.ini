[main]
include=~/.config/foot/themes/noctalia
term=xterm-256color
initial-window-size-chars=100x30
pad=0x0 center
font=monospace:style=Regular:size=12
font-bold=monospace:style=Bold:size=12
font-italic=monospace:style=Italic:size=12
font-bold-italic=monospace:style=Bold Italic:size=12
word-delimiters=,│`|:"' ()[]{}<>	

[scrollback]
lines=10000
multiplier=3

[cursor]
style=underline
blink=no
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.8

[key-bindings]
clipboard-paste=XF86Paste Control+Shift+v
clipboard-copy=XF86Copy Control+Shift+c
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Shift+Home
scrollback-end=Shift+End
search-start=Control+Shift+f Control+Shift+b
font-reset=Control+0

[search-bindings]
find-prev=Control+Shift+b
